# Alternativa ao .env: copie para application-secrets.properties (ignorado pelo Git).
# Carregue com SPRING_CONFIG_ADDITIONAL_LOCATION=file:./src/main/resources/application-secrets.properties
# Prefira apenas um arquivo local para evitar sobreposicoes.
app.frontend-url=http://localhost:5173
spring.datasource.url=jdbc:mysql://localhost:3306/controle_financeiro?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
# No Brevo, use o login SMTP da conta e a chave SMTP (nao a chave da API).
spring.mail.username=
spring.mail.password=
spring.mail.from=
# Obrigatorio: chave aleatoria com pelo menos 32 bytes.
jwt.secret=
jwt.access-expiration=3600000
jwt.refresh-expiration=7200000
app.cookie.secure=false
app.cookie.same-site=Lax
