spring.application.name=backend
spring.config.import=optional:classpath:application-secrets.properties
spring.messages.basename=messages

# Configurações de Banco de Dados (Valores padrão locais ou via Variáveis de Ambiente)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/controle_financeiro}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações do Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Configuração de E-mail (Valores configuráveis por Variáveis de Ambiente)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:email@exemplo.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Configuração do Segredo JWT
jwt.secret=${JWT_SECRET:ChaveSecretaSuperSeguraComPeloMenos256BitsDeComprimentoParaAlgoritmoHS256}
jwt.expiration=${JWT_EXPIRATION:86400000}